# Target Products List
# Define the items you want to monitor here.
# For each item, you can specify required and excluded keywords to ensure the bot catches the right products.

targets:
  - name: "iPhone 14 Pro"
    keyword: "iPhone 14 Pro 128G"
    sort_by: "3"
    delay_range: [3, 8]
    # The title MUST contain these words (case insensitive):
    required_keywords: ["14", "pro"]
    # The title MUST NOT contain these words (to avoid accessories & wrong models):
    excluded_keywords: ["max", "plus", "12", "13", "15", "11", "殼", "貼", "膜", "線", "盒", "鏡頭", "配件", "交換", "換", "收", "徵", "求"]
    # Provide an initial baseline market price (used before enough data is collected for dynamic pricing)
    market_price_estimate: 20000
